<style>
/* ============================================================
   ENGLISH://MASTER — Design system
   Signature idea: this app is a terminal program that learned
   to be a website. The color palette, the "window chrome" on
   every panel, and the block-segment timer bar are all direct
   descendants of the original Python CLI's ANSI colors and
   progress bar. Everything else stays quiet around them.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');

:root{
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-body: 'Be Vietnam Pro', -apple-system, 'Segoe UI', Roboto, sans-serif;

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;

  --cyan: #00CCFF;
  --cyan-ink: #062229;
  --green: #35E27A;
  --green-ink: #04180D;
  --yellow: #FFC531;
  --yellow-ink: #241900;
  --red: #FF5C5C;
  --red-ink: #250505;
  --orange: #FF8A3D;
  --pink: #FF4FA3;

  --shadow: 0 8px 24px -8px rgba(0,0,0,.35);
  --shadow-sm: 0 2px 8px -2px rgba(0,0,0,.3);
}

[data-theme="dark"]{
  --bg: #0A0E13;
  --bg-elevated: #10161D;
  --surface: #131A22;
  --surface-hover: #1A2330;
  --surface-active: #202B3A;
  --border: #212C39;
  --border-strong: #324255;
  --text: #EAEFF4;
  --text-muted: #90A0B0;
  --text-faint: #576677;
  --scrim: rgba(5,8,12,.7);
}

[data-theme="light"]{
  --bg: #F3F6F9;
  --bg-elevated: #FFFFFF;
  --surface: #FFFFFF;
  --surface-hover: #EDF2F7;
  --surface-active: #E3EAF0;
  --border: #DCE4EB;
  --border-strong: #C1CCD6;
  --text: #101820;
  --text-muted: #57687A;
  --text-faint: #8A97A3;
  --scrim: rgba(20,28,38,.45);

  --cyan: #0089B8;
  --green: #1C9A56;
  --yellow: #A66900;
  --red: #D93A3A;
  --orange: #C25A16;
  --pink: #C93A88;
}

*{ box-sizing: border-box; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4{ margin:0; font-family: var(--font-mono); letter-spacing: -0.01em; }
p{ margin:0; }
button{ font-family: inherit; }
input, textarea{ font-family: inherit; }
::selection{ background: var(--cyan); color: var(--cyan-ink); }

/* Respect reduced motion everywhere */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

/* Focus visibility */
:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }

/* ---------- Layout shell ---------- */
#app{ min-height: 100vh; display:flex; flex-direction:column; }

.topbar{
  position: sticky; top:0; z-index: 40;
  display:flex; align-items:center; justify-content:space-between;
  gap: 12px;
  padding: 12px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.topbar__brand{ display:flex; align-items:center; gap:9px; cursor:pointer; background:none; border:none; color:inherit; padding:0; }
.topbar__brand-mark{
  width:30px; height:30px; border-radius: 8px;
  background: linear-gradient(145deg, var(--cyan), var(--pink));
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-weight:800; color:#04141A; font-size:15px;
  flex-shrink: 0;
}
.topbar__brand-text{ font-family: var(--font-mono); font-weight:700; font-size:15px; letter-spacing:-0.01em; }
.topbar__brand-text .cursor{ display:inline-block; width:8px; height:15px; background: var(--cyan); margin-left:3px; vertical-align:-2px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }

.topbar__actions{ display:flex; align-items:center; gap:8px; }

.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding: 6px 10px; border-radius: 999px;
  background: var(--surface); border:1px solid var(--border);
  font-family: var(--font-mono); font-size: 12.5px; font-weight:600; color: var(--text-muted);
}
.pill strong{ color: var(--text); font-weight:700; }
.pill.streak{ color: var(--orange); border-color: color-mix(in srgb, var(--orange) 35%, var(--border)); }
.pill.streak strong{ color: var(--orange); }

.iconbtn{
  width:36px; height:36px; border-radius: 8px;
  background: var(--surface); border:1px solid var(--border);
  color: var(--text-muted);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition: background .15s, color .15s, border-color .15s;
  flex-shrink:0;
}
.iconbtn:hover{ background: var(--surface-hover); color: var(--text); }

main{ flex:1; width:100%; max-width: 880px; margin: 0 auto; padding: 20px 16px 96px; }

/* ---------- Terminal window panel (signature component) ---------- */
.term{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.term__bar{
  display:flex; align-items:center; gap:10px;
  padding: 9px 14px;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
}
.term__dots{ display:flex; gap:5px; }
.term__dot{ width:8px; height:8px; border-radius:2px; }
.term__dot:nth-child(1){ background: var(--cyan); }
.term__dot:nth-child(2){ background: var(--yellow); }
.term__dot:nth-child(3){ background: var(--pink); }
.term__path{ font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }
.term__body{ padding: 22px; }
.term__body.tight{ padding: 14px 16px; }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding: 12px 20px; border-radius: var(--radius);
  font-weight: 700; font-size: 14.5px; letter-spacing: 0.01em;
  border: 1px solid transparent; cursor: pointer;
  transition: transform .08s ease, filter .15s, background .15s, border-color .15s;
  user-select: none;
}
.btn:active{ transform: scale(0.98); }
.btn:disabled{ opacity: .45; cursor: not-allowed; }
.btn-block{ width:100%; }
.btn-lg{ padding: 15px 22px; font-size: 16px; }
.btn-primary{ background: var(--cyan); color: var(--cyan-ink); }
.btn-primary:hover:not(:disabled){ filter: brightness(1.08); }
.btn-secondary{ background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover:not(:disabled){ background: var(--surface-hover); }
.btn-ghost{ background: transparent; color: var(--text-muted); border-color: var(--border); }
.btn-ghost:hover:not(:disabled){ color: var(--text); border-color: var(--border-strong); }
.btn-danger{ background: var(--red); color: #2a0808; }
.btn-danger:hover:not(:disabled){ filter: brightness(1.08); }
.btn-pink{ background: var(--pink); color: #2a0619; }
.btn-sm{ padding: 8px 13px; font-size: 13px; border-radius: var(--radius-sm); }

/* ---------- Cards / grids ---------- */
.grid{ display:grid; gap:12px; }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
.grid-3{ grid-template-columns: repeat(3, 1fr); }
@media (max-width: 640px){ .grid-3{ grid-template-columns: repeat(2, 1fr); } }

.action-card{
  display:flex; flex-direction:column; gap:10px;
  text-align:left; padding:16px; border-radius: var(--radius);
  background: var(--surface); border:1px solid var(--border);
  cursor:pointer; transition: border-color .15s, background .15s, transform .08s;
}
.action-card:hover{ border-color: var(--border-strong); background: var(--surface-hover); }
.action-card:active{ transform: scale(0.99); }
.action-card__icon{
  width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:18px; background: var(--bg-elevated); border:1px solid var(--border);
}
.action-card__title{ font-weight:700; font-size:15px; }
.action-card__sub{ font-size:13px; color: var(--text-muted); line-height:1.4; }

.stat-strip{ display:flex; gap:10px; overflow-x:auto; padding-bottom:2px; }
.stat-chip{
  flex:1; min-width: 108px;
  padding:12px 14px; border-radius: var(--radius);
  background: var(--surface); border:1px solid var(--border);
}
.stat-chip__value{ font-family: var(--font-mono); font-weight:800; font-size:22px; }
.stat-chip__label{ font-size:12px; color: var(--text-muted); margin-top:2px; }

/* ---------- Section headers ---------- */
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin: 28px 0 12px; }
.section-head:first-child{ margin-top:0; }
.eyebrow{ font-family: var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color: var(--cyan); font-weight:700; }
.section-title{ font-size:18px; font-weight:700; margin-top:4px; }
.link-more{ font-size:13px; color: var(--text-muted); background:none; border:none; cursor:pointer; font-weight:600; }
.link-more:hover{ color: var(--cyan); }

/* ---------- Badges / tags ---------- */
.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; font-family: var(--font-mono); }
.badge-lvl1{ background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.badge-lvl2{ background: color-mix(in srgb, var(--yellow) 18%, transparent); color: var(--yellow); }
.badge-lvl3{ background: color-mix(in srgb, var(--pink) 18%, transparent); color: var(--pink); }
[data-theme="light"] .badge-lvl2{ background: color-mix(in srgb, var(--yellow) 16%, transparent); }

.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding: 7px 13px; border-radius:999px; font-size:13px; font-weight:600;
  background: var(--surface); border:1px solid var(--border); color: var(--text-muted);
  cursor:pointer; white-space:nowrap; transition: all .15s;
}
.chip:hover{ border-color: var(--border-strong); color: var(--text); }
.chip.active{ background: var(--cyan); border-color: var(--cyan); color: var(--cyan-ink); }
.chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin: 0 -16px; padding-left:16px; padding-right:16px; }
.chip-row::-webkit-scrollbar{ display:none; }

/* ---------- Forms ---------- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:13px; font-weight:600; color: var(--text-muted); margin-bottom:7px; }
.input, textarea.input{
  width:100%; padding: 13px 14px; border-radius: var(--radius);
  background: var(--bg-elevated); border:1.5px solid var(--border-strong); color: var(--text);
  font-size:16px; transition: border-color .15s;
}
.input:focus{ border-color: var(--cyan); outline:none; }
textarea.input{ resize: vertical; min-height:120px; font-family: var(--font-mono); font-size:14px; line-height:1.6; }
.hint{ font-size:12.5px; color: var(--text-faint); margin-top:6px; }
.error-text{ font-size:12.5px; color: var(--red); margin-top:6px; font-weight:600; }

/* ---------- Word library list ---------- */
.word-row{
  display:flex; align-items:center; gap:12px;
  padding: 13px 14px; border-radius: var(--radius);
  background: var(--surface); border:1px solid var(--border);
  margin-bottom:8px;
}
.word-row__main{ flex:1; min-width:0; }
.word-row__en{ font-family: var(--font-mono); font-weight:700; font-size:15.5px; }
.word-row__vn{ font-size:13.5px; color: var(--text-muted); margin-top:2px; }
.word-row__cat{ font-size:11.5px; color: var(--text-faint); margin-top:3px; }
.word-row__actions{ display:flex; gap:6px; flex-shrink:0; }
.iconbtn.small{ width:32px; height:32px; }
.iconbtn.on{ color: var(--yellow); border-color: color-mix(in srgb, var(--yellow) 40%, var(--border)); }

/* ---------- Quiz screen ---------- */
.quiz-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
.quiz-progress{ font-family: var(--font-mono); font-size:13px; color: var(--text-muted); font-weight:600; }
.quiz-mode-tag{ font-family: var(--font-mono); font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; background: var(--surface-hover); border:1px solid var(--border); color: var(--text-muted); }

.timerbar{ display:flex; gap:3px; margin-bottom:8px; }
.timerbar__seg{ flex:1; height:9px; border-radius:2px; background: var(--border); transition: background .12s linear; }
.timerbar__seg.f-good{ background: var(--green); }
.timerbar__seg.f-warn{ background: var(--yellow); }
.timerbar__seg.f-danger{ background: var(--red); }
.timer-readout{ display:flex; justify-content:space-between; font-family: var(--font-mono); font-size:12px; color: var(--text-faint); margin-bottom:20px; }
.timer-readout.danger{ color: var(--red); }

.prompt-word{
  font-family: var(--font-mono); font-weight:800; font-size: clamp(26px, 6vw, 38px);
  text-align:center; letter-spacing:0.01em; margin: 6px 0 22px; word-break: break-word;
}
.prompt-sub{ text-align:center; color: var(--text-muted); font-size:13px; margin-top:-14px; margin-bottom:20px; }

.tile-row{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:22px; }
.tile{
  min-width:34px; height:44px; padding: 0 4px; border:2px solid var(--border-strong); border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); font-weight:700; font-size:17px; background: var(--bg-elevated);
}
.tile.blank{ border-color: var(--cyan); color: var(--cyan); background: color-mix(in srgb, var(--cyan) 8%, var(--bg-elevated)); }
.tile.space{ border:none; background:none; width:16px; min-width:16px; }

.mc-options{ display:grid; gap:10px; }
.mc-opt{
  display:flex; align-items:center; gap:12px; text-align:left;
  padding: 15px 16px; border-radius: var(--radius); background: var(--surface);
  border:1.5px solid var(--border); cursor:pointer; font-size:15px; font-weight:600;
  transition: border-color .12s, background .12s;
}
.mc-opt:hover{ border-color: var(--border-strong); }
.mc-opt__key{ font-family: var(--font-mono); font-size:12px; font-weight:800; color: var(--text-faint); width:20px; flex-shrink:0; }
.mc-opt.correct{ border-color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--surface)); }
.mc-opt.wrong{ border-color: var(--red); background: color-mix(in srgb, var(--red) 12%, var(--surface)); }
.mc-opt:disabled, .mc-opt.disabled{ cursor:default; }

.tf-row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
.tf-btn{ padding: 22px 12px; border-radius: var(--radius); font-family: var(--font-mono); font-weight:800; font-size:17px; border:1.5px solid var(--border-strong); cursor:pointer; background: var(--surface); transition: all .12s; }
.tf-btn.tf-true{ color: var(--green); }
.tf-btn.tf-false{ color: var(--red); }
.tf-btn.correct{ background: color-mix(in srgb, var(--green) 15%, var(--surface)); border-color: var(--green); }
.tf-btn.wrong{ background: color-mix(in srgb, var(--red) 15%, var(--surface)); border-color: var(--red); }

.answer-row{ display:flex; gap:10px; }
.answer-row .input{ flex:1; }

.feedback-banner{
  margin-top:16px; padding:13px 16px; border-radius: var(--radius);
  font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px;
  animation: rise .18s ease;
}
@keyframes rise{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }
.feedback-banner.ok{ background: color-mix(in srgb, var(--green) 15%, var(--surface)); color: var(--green); border:1px solid color-mix(in srgb, var(--green) 40%, var(--border)); }
.feedback-banner.bad{ background: color-mix(in srgb, var(--red) 15%, var(--surface)); color: var(--red); border:1px solid color-mix(in srgb, var(--red) 40%, var(--border)); }

.speak-btn{
  width:44px; height:44px; border-radius:999px; flex-shrink:0;
  background: var(--surface); border:1.5px solid var(--border-strong); color: var(--cyan);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.speak-btn:hover{ background: var(--surface-hover); }
.speak-btn.lg{ width:60px; height:60px; margin: 0 auto 20px; }

/* ---------- Flashcard ---------- */
.flashcard-wrap{ perspective: 1200px; margin-bottom:22px; }
.flashcard{
  position:relative; height: 220px; border-radius: var(--radius-lg);
  transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.8,.2,1);
  cursor:pointer;
}
.flashcard.flipped{ transform: rotateY(180deg); }
.flashcard__face{
  position:absolute; inset:0; backface-visibility:hidden;
  border-radius: var(--radius-lg); border:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  padding: 20px; text-align:center;
  background: var(--surface); box-shadow: var(--shadow-sm);
}
.flashcard__face--back{ transform: rotateY(180deg); background: var(--bg-elevated); }
.flashcard.has-ex{ height: 320px; }
.flashcard__face--back{ overflow-y:auto; padding-bottom:40px; }
.flashcard__vn{ font-family: var(--font-body); font-size:22px; line-height:1.3; }
.flashcard__ex{ width:100%; padding:10px 12px; border-radius: var(--radius); background: var(--surface); border:1px solid var(--border); }
.flashcard__ex-en{ font-size:15px; line-height:1.45; font-weight:500; }
.flashcard__ex-vn{ font-size:13px; line-height:1.4; color: var(--text-muted); margin-top:4px; }
.word-row__ex{ font-size:12.5px; line-height:1.4; color: var(--text-faint); font-style:italic; margin-top:4px; }
.flashcard__word{ font-family: var(--font-mono); font-weight:800; font-size: clamp(22px,5vw,30px); }
.flashcard__hint{ font-size:12px; color: var(--text-faint); position:absolute; bottom:14px; }

/* ---------- Results screen ---------- */
.result-hero{ text-align:center; padding: 30px 20px; }
.result-score{ font-family: var(--font-mono); font-weight:800; font-size: 52px; line-height:1; }
.result-label{ margin-top:10px; font-weight:800; font-size:16px; letter-spacing:.03em; }

.progress-bar-outer{ height:8px; border-radius:999px; background: var(--border); overflow:hidden; margin: 18px 0 6px; }
.progress-bar-inner{ height:100%; border-radius:999px; transition: width .5s ease; }

/* ---------- Misc ---------- */
.divider{ height:1px; background: var(--border); margin: 20px 0; border:none; }
.muted{ color: var(--text-muted); }
.center{ text-align:center; }
.row{ display:flex; align-items:center; }
.row-between{ display:flex; align-items:center; justify-content:space-between; }
.gap-8{ gap:8px; } .gap-10{ gap:10px; } .gap-12{ gap:12px; }
.stack{ display:flex; flex-direction:column; gap:10px; }
.empty-state{ text-align:center; padding: 44px 20px; color: var(--text-muted); }
.empty-state__icon{ font-size:34px; margin-bottom:10px; }

.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background: var(--bg-elevated); border:1px solid var(--border-strong); color: var(--text);
  padding:12px 18px; border-radius: 999px; font-size:13.5px; font-weight:600;
  box-shadow: var(--shadow); z-index: 90; display:flex; align-items:center; gap:8px;
  animation: toastin .2s ease;
}
@keyframes toastin{ from{ opacity:0; transform: translateX(-50%) translateY(8px);} to{ opacity:1; transform: translateX(-50%);} }

.modal-scrim{ position:fixed; inset:0; background: var(--scrim); z-index:80; display:flex; align-items:flex-end; justify-content:center; }
@media (min-width: 640px){ .modal-scrim{ align-items:center; } }
.modal-sheet{ width:100%; max-width:480px; max-height:88vh; overflow:auto; background: var(--bg-elevated); border-radius: 18px 18px 0 0; border:1px solid var(--border); padding:22px; }

<script>
// ============================================================
// CORE.JS — Pure game-logic functions (no DOM), ported & improved
// from the original Python CLI (tao_tu_khuyet, tao_tu_giai_ma,
// tinh_diem_cau_hoi, tao_cau_hoi, xuly_cau_dung_sai, ...)
// Kept dependency-free so it can be unit-tested with plain Node.
// ============================================================

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sampleArray(arr, n) {
  return shuffleArray(arr).slice(0, Math.min(n, arr.length));
}

// Matches Python: diem = 5.0 + 5.0 * (time_remaining/time_limit), round 1dp
function computeScore(timeRemaining, timeLimit) {
  if (!timeLimit || timeLimit <= 0) return 10.0;
  const ratio = Math.max(0, Math.min(1, timeRemaining / timeLimit));
  const score = 5.0 + 5.0 * ratio;
  return Math.round(score * 10) / 10;
}

// Matches Python thresholds in nhap_co_dem_nguoc: >50% green, >20% yellow, else red
function getTimerZone(timeRemaining, timeLimit) {
  if (!timeLimit || timeLimit <= 0) return 'good';
  const ratio = timeRemaining / timeLimit;
  if (ratio > 0.5) return 'good';
  if (ratio > 0.2) return 'warn';
  return 'danger';
}

// Matches Python hien_thi_ket_qua_diem thresholds
function getRating(avgScore) {
  if (avgScore >= 9.0) return { label: 'XUẤT SẮC', emoji: '🏆', zone: 'good' };
  if (avgScore >= 8.0) return { label: 'GIỎI', emoji: '🌟', zone: 'info' };
  if (avgScore >= 6.5) return { label: 'KHÁ', emoji: '👍', zone: 'warn' };
  return { label: 'CẦN CỐ GẮNG', emoji: '💡', zone: 'danger' };
}

// --- Fill-in-the-blank: mask ~40% of alpha chars (min 1), like tao_tu_khuyet ---
// Returns an array of {ch, masked} for every character in `word` (spaces included,
// spaces are never masked). Works across the whole phrase, same spirit as the original.
function maskWord(word) {
  const chars = word.split('');
  const n = chars.length;
  const validIdx = [];
  chars.forEach((c, i) => { if (/[a-zA-Z]/.test(c)) validIdx.push(i); });
  if (validIdx.length === 0) return chars.map(c => ({ ch: c, masked: false }));

  let numToMask = n <= 2 ? 1 : Math.max(1, Math.floor(n * 0.4));
  numToMask = Math.min(numToMask, validIdx.length);
  const maskedIdx = new Set(sampleArray(validIdx, numToMask));

  return chars.map((c, i) => ({ ch: c, masked: maskedIdx.has(i) }));
}

// --- Unscramble: shuffle letters WITHIN each word of the phrase, keep spaces fixed.
// Improvement over the original (which shuffled the whole phrase incl. spaces,
// making multi-word idioms nearly unsolvable). Falls back cleanly for single words.
function shuffleWordPerToken(word) {
  const tokens = word.split(' ');
  const shuffledTokens = tokens.map(tok => {
    const chars = tok.split('');
    if (chars.length <= 1) return chars;
    let attempt = 0;
    let shuffled = chars.slice();
    while (shuffled.join('') === chars.join('') && attempt < 10) {
      shuffled = shuffleArray(chars);
      attempt++;
    }
    return shuffled;
  });
  return shuffledTokens; // array of char-arrays, one per word-token
}

// --- Multiple choice question builder, mirrors tao_cau_hoi (per word) ---
function buildMCQuestion(en, vn, vnPool) {
  const incorrectPool = [...new Set(vnPool.filter(v => v !== vn))];
  const numIncorrect = Math.min(3, incorrectPool.length);
  const options = sampleArray(incorrectPool, numIncorrect);
  options.push(vn);
  return { en, vn, options: shuffleArray(options) };
}

// --- True/False pair builder, mirrors xuly_cau_dung_sai ---
function buildTrueFalse(en, vn, vnPool, forceTrue) {
  const otherOptions = vnPool.filter(v => v !== vn);
  let isTrue = forceTrue;
  let shownVn = vn;
  if (forceTrue === undefined) isTrue = Math.random() < 0.5;
  if (isTrue || otherOptions.length === 0) {
    shownVn = vn;
    isTrue = true;
  } else {
    shownVn = otherOptions[Math.floor(Math.random() * otherOptions.length)];
  }
  return { en, correctVn: vn, shownVn, isTrue };
}

// --- Balanced true/false flags for a session, mirrors tf_flags logic ---
function buildBalancedTFFlags(count) {
  const flags = [];
  for (let i = 0; i < Math.floor(count / 2) + 1; i++) flags.push(true, false);
  return shuffleArray(flags).slice(0, count);
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    shuffleArray, sampleArray, computeScore, getTimerZone, getRating,
    maskWord, shuffleWordPerToken, buildMCQuestion, buildTrueFalse, buildBalancedTFFlags,
  };
}

function parseVocab(raw) {
  return raw.split('\n').filter(Boolean).map((line, idx) => {
    const [en, vn, level, cat] = line.split('|');
    return { id: idx, en, vn, level: Number(level), cat };
  });
}

function buildVocab(){
  const list = parseVocab(VOCAB_RAW);
  const byKey = new Map(list.map(w => [w.en.toLowerCase(), w]));
  // Dữ liệu bổ sung (vocab-extra.js): từ mới + câu ví dụ
  const extra = (typeof VOCAB_EXTRA_RAW === 'string') ? VOCAB_EXTRA_RAW : '';
  for (const line of extra.split('\n')){
    const s = line.trim();
    if (!s || s.startsWith('//')) continue;
    if (s[0] === '@'){
      const [en, ex, exVn] = s.slice(1).split('|');
      const w = byKey.get((en || '').trim().toLowerCase());
      if (w && ex && !w.ex){ w.ex = ex.trim(); w.exVn = (exVn || '').trim(); }
      continue;
    }
    const [en, vn, level, cat, ex, exVn] = s.split('|');
    if (!en || !vn || !CAT_META[cat] || ![1,2,3].includes(Number(level))) continue;
    const key = en.trim().toLowerCase();
    if (byKey.has(key)) continue;
    const w = { id: list.length, en: en.trim(), vn: vn.trim(), level: Number(level), cat, ex: (ex || '').trim(), exVn: (exVn || '').trim() };
    list.push(w); byKey.set(key, w);
  }
  return list;
}
const VOCAB = buildVocab();
const VOCAB_BY_EN = new Map(VOCAB.map(w => [w.en.toLowerCase(), w]));

// Lưu trong localStorage của trình duyệt (tiền tố riêng để không đụng app khác
// cùng domain github.io). Nếu localStorage bị chặn, dữ liệu chỉ giữ trong bộ nhớ.
const STORE_PREFIX = 'enmaster:v1:';
const memStore = {};
let booted = false;
function lsAvailable(){
  try{ const k='__enmaster_test'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
const HAS_LS = lsAvailable();
let storageWarned = false;
function warnStorage(){
  if (storageWarned) return; storageWarned = true;
  setTimeout(()=> toast('⚠️ Trình duyệt chặn lưu dữ liệu. Hãy xuất file sao lưu trong mục Thống kê.'), 300);
}
async function loadKey(key, fallback){
  try{
    if (HAS_LS){
      const raw = localStorage.getItem(STORE_PREFIX + key);
      return raw == null ? fallback : JSON.parse(raw);
    }
    if (key in memStore) return JSON.parse(memStore[key]);
  }catch(e){
    // Dữ liệu hỏng → dùng mặc định, nhưng giữ lại bản hỏng để có thể cứu, không ghi đè mất.
    try{ if (HAS_LS){ const bad = localStorage.getItem(STORE_PREFIX + key); if (bad) localStorage.setItem(STORE_PREFIX + 'corrupt:' + key, bad); } }catch(_){}
  }
  return fallback;
}
async function saveKey(key, value){
  const s = JSON.stringify(value);
  try{
    if (HAS_LS) localStorage.setItem(STORE_PREFIX + key, s);
    else { memStore[key] = s; warnStorage(); }
  }catch(e){ memStore[key] = s; warnStorage(); }
}
const persistStats = () => saveKey('stats', S.stats);
const persistFavorites = () => saveKey('favorites', [...S.favorites]);
const persistMistakes = () => saveKey('mistakes', S.mistakes);

  if (!booted) return; // tránh ghi đè dữ liệu cũ bằng giá trị mặc định khi chưa tải xong

const STATS_DEFAULTS = {xp:0, streak:0, lastStudyDate:null, totalCorrect:0, totalAttempts:0, totalSessions:0};
function buildBackup(){
  return { app:'english-master', version:1, exportedAt:new Date().toISOString(),
    data:{ stats:S.stats, favorites:[...S.favorites], mistakes:S.mistakes, customLists:S.customLists, theme:S.theme } };
}
function exportData(){
  S.stats.lastBackup = Date.now();
  persistStats();
  const blob = new Blob([JSON.stringify(buildBackup(), null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'english-master-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 1500);
  toast('✅ Đã xuất file sao lưu');
  render();
}
function parseBackup(text){
  const d = JSON.parse(text);
  if (!d || d.app !== 'english-master' || !d.data || typeof d.data !== 'object') throw new Error('bad');
  const x = d.data;
  const stats = Object.assign({}, STATS_DEFAULTS, (x.stats && typeof x.stats === 'object') ? x.stats : {});
  ['xp','streak','totalCorrect','totalAttempts','totalSessions'].forEach(k=>{ stats[k] = Number(stats[k]) || 0; });
  return {
    stats,
    favorites: Array.isArray(x.favorites) ? x.favorites.filter(v=>typeof v==='string') : [],
    mistakes: (x.mistakes && typeof x.mistakes === 'object' && !Array.isArray(x.mistakes)) ? x.mistakes : {},
    customLists: (x.customLists && typeof x.customLists === 'object' && !Array.isArray(x.customLists)) ? x.customLists : {},
    theme: x.theme === 'light' ? 'light' : 'dark',
  };
}
function importData(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = parseBackup(String(reader.result)); }
    catch(e){ toast('❌ File không hợp lệ'); return; }
    showConfirm('Khôi phục sẽ ghi đè toàn bộ dữ liệu hiện tại (XP, streak, từ hay sai, yêu thích, danh sách riêng). Tiếp tục?', () => {
      S.stats = parsed.stats;
      S.favorites = new Set(parsed.favorites);
      S.mistakes = parsed.mistakes;
      S.customLists = parsed.customLists;
      S.theme = parsed.theme;
      document.documentElement.setAttribute('data-theme', S.theme);
      persistAll();
      toast('✅ Đã khôi phục dữ liệu');
      render();
    }, 'Khôi phục');
  };
  reader.onerror = () => toast('❌ Không đọc được file');
  reader.readAsText(file);
}

const EN_LABEL_RE = /-(verb|noun|tech|biz|pol|sci|econ|corp|media|daily|climate|illness|basic|mail|tool|device|adv|travel|plan|sport)$/i;
function cleanEn(en){
  const k = String(en);

  return k.replace(/\s*\([^)]*\)\s*$/, '').replace(EN_LABEL_RE, '');
}

function xpLevel(xp){
  // Simple curve: level n requires n*120 cumulative xp
  let lvl = 1, need = 120, total = 0;
  while (xp >= total + need){ total += need; lvl++; need += 40; }
  const into = xp - total;
  return { level: lvl, into, need, pct: clamp(Math.round(into/need*100),0,100) };
}

  if (S.stats.lastStudyDate !== today){
    S.stats.streak = (S.stats.lastStudyDate === yesterdayKey()) ? S.stats.streak + 1 : 1;
    S.stats.lastStudyDate = today;
  }
  S.stats.xp += xpGain;
}

// ---------- render shell ----------
function navigate(view, opts={}){
  // Defensive cleanup: a session/flashcard-session should only ever be "live"
  // while its own view is showing. Leaving either view through any path other
  // than its own cancel/exit action still safely tears it down here, so the
  // top bar and state never fall out of sync with what's on screen.
  if (view !== 'quiz' && S.session){ clearInterval(S.session.timerHandle); clearTimeout(S.session.advanceHandle); S.session = null; }
  if (view !== 'flashcards'){ S.flashSession = null; }

  S.view = view;
  Object.assign(S, opts);
  render();
  window.scrollTo({top:0, behavior:'instant'});
}

// render() redraws the current view WITHOUT resetting scroll — used both by
// navigate() (which explicitly scrolls to top after) and by in-place updates
// like toggling a favorite star or switching a filter chip, where snapping
// the page back to top would be jarring while browsing a long list.
function render(){
  const app = document.getElementById('app');
  app.innerHTML = topbarHtml() + `<main id="main">${viewFor(S.view)}</main>`;

function categoriesForLevel(level){
  if (level === 'all') return Object.keys(CAT_META);
  const set = new Set();
  for (const w of VOCAB) if (String(w.level) === String(level)) set.add(w.cat);
  return Object.keys(CAT_META).filter(c => set.has(c));
}

function filteredLibraryWords(){
  const { level, cat, search } = S.library;
  const q = search.trim().toLowerCase();
  return VOCAB.filter(w => {
    if (level !== 'all' && String(w.level) !== String(level)) return false;
    if (cat !== 'all' && w.cat !== cat) return false;
    if (q && !(w.en.toLowerCase().includes(q) || w.vn.toLowerCase().includes(q))) return false;
    return true;
  });
}

function dedupeByEn(words){
  const seen = new Set(); const out = [];
  for (const w of words){ const k=w.en.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push(w); } }
  return out;
}

function quickFlashcardWords(){
  const pool = dedupeByEn([...mistakeList(), ...favoriteWords()]);
  if (pool.length >= 6) return sampleArrayLocal(pool, Math.min(20, pool.length));
  return sampleArrayLocal(VOCAB.filter(w=>w.level===1), 20);
}
function sampleArrayLocal(arr, n){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0, Math.min(n,a.length));
}

function parseCustomInput(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const dict = []; const seen = new Set(); let badCount = 0;
  for (const line of lines){
    // Ưu tiên dấu " - " có khoảng trắng hai bên (cho phép từ như well-known, mother-in-law);
    // nếu không có thì dùng dấu "-" đầu tiên như trước.
    let idx = line.search(/\s[-–—]\s/);
    let sepLen = 0;
    if (idx !== -1){ sepLen = line.slice(idx).match(/^\s[-–—]\s/)[0].length; }
    else { idx = line.indexOf('-'); sepLen = 1; }
    if (idx === -1){ badCount++; continue; }
    const en = line.slice(0, idx).trim().toLowerCase();
    let vn = line.slice(idx + sepLen).trim();
    if (vn) vn = vn.charAt(0).toUpperCase() + vn.slice(1);
    if (en && vn && !seen.has(en)){ seen.add(en); dict.push({ en, vn }); }
    else badCount++;
  }
  return { dict, badCount };
}

// ============================================================

function buildQuestions(words, mode){
  const vnPool = words.map(w=>w.vn);
  const shuffled = shuffleArray(words);
  if (mode === 'mc' || mode === 'listen'){
    return shuffled.map(w => ({ type:mode, word:w, ...buildMCQuestion(w.en, w.vn, vnPool) }));
  }
  if (mode === 'tf'){
    const flags = buildBalancedTFFlags(shuffled.length);
    return shuffled.map((w,i) => ({ type:'tf', word:w, ...buildTrueFalse(w.en, w.vn, vnPool, flags[i]) }));
  }
  if (mode === 'mixed'){
    let all = [];
    for (let r=0;r<3;r++) all = all.concat(shuffleArray(words));
    const flags = buildBalancedTFFlags(all.length);
    const cycle = ['mc','tf','fill','decode','lookup'];
    return all.map((w,i) => {
      const type = cycle[i % 5];
      if (type==='mc') return { type, word:w, ...buildMCQuestion(w.en,w.vn,vnPool) };
      if (type==='tf') return { type, word:w, ...buildTrueFalse(w.en,w.vn,vnPool, flags[i]) };
      return { type, word:w };
    });
  }
  return shuffled.map(w => ({ type: mode, word: w })); // lookup, fill, decode
}

function startSession(words, mode, timeLimit, sourceLabel){
  // The two session types are mutually exclusive — always clear the other
  // one first so the top bar and cancel/exit actions never get confused.
  if (S.session){ clearInterval(S.session.timerHandle); clearTimeout(S.session.advanceHandle); S.session = null; }
  S.flashSession = null;

  if (mode === 'flash'){
    S.flashSession = { words: shuffleArray(words), index:0, flipped:false, knowCount:0, total: words.length, sourceLabel };
    navigate('flashcards');
    return;
  }
  const questions = buildQuestions(words, mode);
  S.session = {
    words, mode, timeLimit, sourceLabel, questions,
    index:0, scores:[], wrongWords:[],
    timerStart:null, timerHandle:null, answered:false, freeLog:[],
  };
  navigate('quiz');
}

function cancelSession(){
  if (S.session){ clearInterval(S.session.timerHandle); clearTimeout(S.session.advanceHandle); }
  S.session = null;
  navigate('setup');
}

// ---------- rendering ----------
function renderTiles(word, kind){
  if (kind === 'fill'){
    const arr = maskWord(word);
    return arr.map(x => x.ch === ' '
      ? '<span class="tile space"></span>'
      : `<span class="tile ${x.masked?'blank':''}">${x.masked?'':escapeHtml(x.ch.toUpperCase())}</span>`
    ).join('');
  }
  const tokens = shuffleWordPerToken(word);
  return tokens.map(tok => tok.map(ch=>`<span class="tile">${escapeHtml(ch.toUpperCase())}</span>`).join(''))
               .join('<span class="tile space"></span>');
}

function renderTimerBar(limit){
  const N = 24;
  const segs = Array.from({length:N}, ()=>'<span class="timerbar__seg"></span>').join('');
  return `<div class="timerbar" id="timerBar">${segs}</div><div class="timer-readout" id="timerReadout">⏳ ${limit.toFixed(1)}s</div>`;
}

function quizHead(sess, q){
  return `<div class="quiz-head">
    <span class="quiz-progress">CÂU ${sess.index+1} / ${sess.questions.length}</span>
    <span class="quiz-mode-tag">${MODES[q.type]?.icon||''} ${MODES[q.type]?.label||''}</span>
  </div>`;
}

function mcBody(q){
  return `
  <div class="prompt-word">${escapeHtml(cleanEn(q.word.en))}</div>
  <div class="mc-options" id="mcOptions">
    ${q.options.map((opt,i)=>`<button class="mc-opt" data-action="submit-mc" data-idx="${i}"><span class="mc-opt__key">${i+1}</span><span>${escapeHtml(opt)}</span></button>`).join('')}
  </div>`;
}
function listenBody(q){
  return `
  <div class="center"><button class="speak-btn lg" data-action="quiz-replay-audio">🔊</button></div>
  <div class="prompt-sub" style="margin-top:-10px;">Bấm loa để nghe lại từ tiếng Anh</div>
  <div class="mc-options" id="mcOptions">

}
function tfBody(q){

  <div class="prompt-word">${escapeHtml(cleanEn(q.word.en))}</div>
  <p class="center" style="margin-bottom:20px; font-size:15.5px;">nghĩa là: <strong style="color:var(--cyan);">${escapeHtml(q.shownVn)}</strong> ?</p>
  <div class="tf-row">
    <button class="tf-btn tf-true" data-action="submit-tf" data-val="1">✓ ĐÚNG</button>
    <button class="tf-btn tf-false" data-action="submit-tf" data-val="0">✕ SAI</button>

function lookupBody(q){

  <div class="answer-row">

    <button class="btn btn-primary" data-action="submit-typed">Trả lời</button>
  </div>`;
}
function fillBody(q){

    <button class="btn btn-primary" data-action="submit-typed">Trả lời</button>

}
function decodeBody(q){

  <div class="tile-row">${renderTiles(cleanEn(q.word.en),'decode')}</div>
  <div class="answer-row">
    <input class="input" id="answerInput" placeholder="Sắp xếp lại thành từ đúng..." autocomplete="off" autocapitalize="off" spellcheck="false"/>
    <button class="btn btn-primary" data-action="submit-typed">Trả lời</button>
  </div>`;
}

function viewQuiz(){
  const sess = S.session;
  if (!sess) return `<div class="empty-state"><div class="empty-state__icon">📭</div>Không có phiên luyện tập nào đang diễn ra.
    <div style="margin-top:14px;"><button class="btn btn-primary btn-sm" data-action="nav" data-view="home">Về trang chủ</button></div></div>`;
  if (sess.mode === 'free') return viewFreeMode(sess);

  const q = sess.questions[sess.index];

    </div>

function viewFreeMode(sess){
  const log = sess.freeLog.slice().reverse().map(entry => `
    <div class="feedback-banner ${entry.ok?'ok':'bad'}">

    </div>`).join('');
  return `

    <div class="term__body">

      <div class="answer-row" style="margin-top:16px;">
        <input class="input" id="freeInput" placeholder="Nhập một từ tiếng Anh..." autocomplete="off" autocapitalize="off" spellcheck="false"/>
        <button class="btn btn-primary" data-action="submit-free">Kiểm tra</button>
      </div>
      <div class="stack" style="margin-top:18px;">${log || '<p class="muted" style="font-size:13px;">Kết quả sẽ hiện ở đây khi bạn nhập từ...</p>'}</div>
    </div>
  </div>
  <button class="btn btn-secondary btn-block" style="margin-top:14px;" data-action="cancel-quiz">← Kết thúc giấy nháp</button>

// ---------- timer ----------
function currentRemaining(){
  const sess = S.session;
  const elapsed = (performance.now() - sess.timerStart) / 1000;
  return Math.max(0, sess.timeLimit - elapsed);
}
function tickTimer(){
  const sess = S.session;
  if (!sess || sess.answered) return;
  const remaining = currentRemaining();
  updateTimerDOM(remaining, sess.timeLimit);
  if (remaining <= 0){
    clearInterval(sess.timerHandle);
    handleTimeout();
  }
}
function updateTimerDOM(remaining, limit){
  const zone = getTimerZone(remaining, limit);
  const bar = document.getElementById('timerBar');
  if (bar){
    const segs = bar.children;
    const filled = Math.round(segs.length * (remaining/limit));
    for (let i=0;i<segs.length;i++) segs[i].className = 'timerbar__seg' + (i<filled ? ' filled f-'+zone : '');
  }
  const ro = document.getElementById('timerReadout');
  if (ro){
    ro.textContent = `⏳ ${remaining.toFixed(1)}s`;
    ro.className = 'timer-readout' + (zone==='danger' ? ' danger' : '');
  }
}
function wireQuizQuestion(){
  const sess = S.session;
  const q = sess.questions[sess.index];
  sess.answered = false;
  sess.timerStart = performance.now();
  clearInterval(sess.timerHandle);
  sess.timerHandle = setInterval(tickTimer, 100);
  updateTimerDOM(sess.timeLimit, sess.timeLimit);
  const input = document.getElementById('answerInput');
  if (input) input.focus();
  if (q.type === 'listen') speak(cleanEn(q.word.en));
}

// ---------- answer handling ----------
function lockQuestionUI(q, meta){
  if (q.type==='mc' || q.type==='listen'){
    $all('#mcOptions .mc-opt').forEach((btn,i)=>{
      btn.disabled = true;
      if (q.options[i] === q.vn) btn.classList.add('correct');
      else if (i === meta.chosenIdx) btn.classList.add('wrong');
    });
  } else if (q.type==='tf'){
    const trueBtn = $('.tf-true'), falseBtn = $('.tf-false');
    if (trueBtn && falseBtn){
      trueBtn.disabled = true; falseBtn.disabled = true;
      (q.isTrue ? trueBtn : falseBtn).classList.add('correct');
      if (meta.chosenBool !== undefined && meta.chosenBool !== q.isTrue){
        (meta.chosenBool ? trueBtn : falseBtn).classList.add('wrong');
      }
    }
  } else {
    const input = document.getElementById('answerInput');
    if (input) input.disabled = true;
  }
}
function renderFeedback(q, correct, score, isTimeout){
  const slot = document.getElementById('feedbackSlot');
  if (!slot) return;
  if (correct){
    slot.innerHTML = `<div class="feedback-banner ok">✅ Chính xác! <span style="margin-left:auto; font-family:var(--font-mono); font-weight:800;">+${fmt1(score)} điểm</span></div>`;
  } else {
    const msg = isTimeout ? 'Hết giờ!' : 'Chưa đúng.';
    slot.innerHTML = `<div class="feedback-banner bad">❌ ${msg} Đáp án đúng: <strong>&nbsp;${escapeHtml(cleanEn(q.word.en))}</strong>&nbsp;— ${escapeHtml(q.word.vn)}</div>`;
  }
}
function finalizeAnswer(q, correct, remaining, meta={}){
  const sess = S.session;
  const score = correct ? computeScore(remaining, sess.timeLimit) : 0.0;
  sess.scores.push(score);
  if (correct) markHeal(q.word); else { markWrong(q.word); sess.wrongWords.push(q.word); }
  lockQuestionUI(q, meta);
  renderFeedback(q, correct, score, meta.isTimeout);
  sess.advanceHandle = setTimeout(() => { if (S.session === sess) advanceQuestion(); }, correct ? 750 : 1450);
}
function submitMC(idx){
  const sess = S.session; if (!sess || sess.answered) return;
  const q = sess.questions[sess.index];
  const remaining = currentRemaining();
  clearInterval(sess.timerHandle);
  sess.answered = true;
  finalizeAnswer(q, q.options[idx] === q.vn, remaining, {chosenIdx: idx});
}
function submitTF(valBool){
  const sess = S.session; if (!sess || sess.answered) return;
  const q = sess.questions[sess.index];
  const remaining = currentRemaining();
  clearInterval(sess.timerHandle);
  sess.answered = true;
  finalizeAnswer(q, valBool === q.isTrue, remaining, {chosenBool: valBool});
}
function submitTyped(){
  const sess = S.session; if (!sess || sess.answered) return;
  const input = document.getElementById('answerInput');
  const val = (input?.value || '').trim();
  const q = sess.questions[sess.index];
  const remaining = currentRemaining();
  clearInterval(sess.timerHandle);
  sess.answered = true;
  const low = val.toLowerCase();
  let correct = val.length > 0 && low === cleanEn(q.word.en).toLowerCase();
  if (!correct && val.length > 0 && q.type === 'lookup'){
    // Nhiều từ tiếng Anh có thể cùng nghĩa tiếng Việt (vd son/boy = "con trai"): chấp nhận cả hai.
    const vnKey = q.word.vn.toLowerCase();
    correct = VOCAB.some(w => w.vn.toLowerCase() === vnKey && cleanEn(w.en).toLowerCase() === low);
  }
  finalizeAnswer(q, correct, remaining, {});
}
function handleTimeout(){
  const sess = S.session; if (!sess || sess.answered) return;
  const q = sess.questions[sess.index];
  sess.answered = true;
  finalizeAnswer(q, false, 0, {isTimeout:true});
}
function advanceQuestion(){
  const sess = S.session;
  if (!sess) return;
  sess.index++;
  if (sess.index >= sess.questions.length) finishSession();
  else render();
}
function submitFree(){
  const sess = S.session; if (!sess) return;
  const input = document.getElementById('freeInput');
  const val = (input?.value || '').trim();
  if (!val) return;
  const found = sess.words.find(w => cleanEn(w.en).toLowerCase() === val.toLowerCase());
  sess.freeLog.push({ text: val, ok: !!found, vn: found ? found.vn : null });
  render();
}

function finishSession(){
  const sess = S.session;
  clearInterval(sess.timerHandle);
  const scores = sess.scores;
  const avg = scores.length ? Math.round((scores.reduce((a,b)=>a+b,0)/scores.length)*10)/10 : 0;
  const rating = getRating(avg);
  const xpGain = Math.round(scores.reduce((a,b)=>a+b,0));
  S.stats.totalSessions++;
  S.stats.totalAttempts += scores.length;
  S.stats.totalCorrect += scores.filter(s=>s>0).length;
  bumpStreakAndXp(xpGain);
  persistStats(); persistMistakes();
  S.lastResult = {
    avg, rating, xpGain, count: scores.length,
    wrongWords: dedupeByEn(sess.wrongWords),
    sourceLabel: sess.sourceLabel, mode: sess.mode, timeLimit: sess.timeLimit, words: sess.words,
  };
  S.session = null;
  navigate('results');
}

function flipCard(){
  const fs = S.flashSession; if (!fs) return;
  fs.flipped = !fs.flipped;
  const elc = document.getElementById('flashcardEl');
  if (elc) elc.classList.toggle('flipped');
}
function advanceFlashcard(){
  const fs = S.flashSession;
  fs.flipped = false;
  fs.index++;
  if (fs.index >= fs.words.length && !fs.streakCounted){
    fs.streakCounted = true;
    bumpStreakAndXp(0);   // học xong một bộ flashcard cũng tính là đã học trong ngày
    persistStats();
  }
  persistMistakes();
  render();
}
function cardKnow(){
  const fs = S.flashSession; if (!fs) return;
  markHeal(fs.words[fs.index]);
  fs.knowCount++;
  advanceFlashcard();
}
function cardDontKnow(){
  const fs = S.flashSession; if (!fs) return;
  const w = fs.words[fs.index];
  markWrong(w);
  fs.missed = fs.missed || [];
  fs.missed.push(w);
  advanceFlashcard();
}
function restartMissedFlashcards(){
  const fs = S.flashSession;
  if (!fs || !(fs.missed||[]).length){ navigate('home'); return; }
  S.flashSession = { words: shuffleArray(fs.missed), index:0, flipped:false, knowCount:0, total: fs.missed.length, sourceLabel: 'Ôn lại từ chưa nhớ' };
  navigate('flashcards');
}
function exitFlashcards(){ S.flashSession = null; navigate('home'); }

  return `
  <div class="row-between">
    <div><div class="eyebrow">Ôn tập thông minh</div><div class="section-title">${list.length} từ hay sai</div></div>
    <button class="btn btn-primary btn-sm" data-action="mistakes-practice">Ôn ngay →</button>
  </div>
  <p class="muted" style="font-size:13.5px; margin:8px 0 16px;">Mỗi lần trả lời sai, từ sẽ xuất hiện ở đây. Trả lời đúng nhiều lần liên tiếp để từ tự biến mất khỏi danh sách.</p>
  <div class="stack">${rows}</div>
  `;
}

// ---------- Favorites ----------
function viewFavorites(){
  const list = favoriteWords();
  if (!list.length){
    return `<div class="empty-state"><div class="empty-state__icon">⭐</div>Chưa có từ yêu thích nào.
      <p class="muted" style="font-size:13px; margin-top:6px;">Bấm ☆ khi duyệt thư viện hoặc làm bài để lưu từ khó nhớ vào đây.</p>
      <div style="margin-top:14px;"><button class="btn btn-primary btn-sm" data-action="nav" data-view="library">Duyệt thư viện</button></div></div>`;
  }
  const rows = list.map(w => `<div class="word-row">
      <div class="word-row__main">
        <div class="word-row__en">${escapeHtml(cleanEn(w.en))} <span class="badge badge-lvl${w.level}" style="margin-left:6px;">${levelName(w.level)}</span></div>
        <div class="word-row__vn">${escapeHtml(w.vn)}</div>
      </div>
      <div class="word-row__actions">
        <button class="iconbtn small" data-action="speak" data-text="${escapeHtml(cleanEn(w.en))}">🔊</button>
        <button class="iconbtn small on" data-action="toggle-fav" data-en="${escapeHtml(w.en)}">★</button>
      </div>
    </div>`).join('');
  return `
  <div class="row-between">
    <div><div class="eyebrow">Đã lưu</div><div class="section-title">${list.length} từ yêu thích</div></div>
    <button class="btn btn-primary btn-sm" data-action="favorites-practice">Luyện tập →</button>
  </div>
  <div class="stack" style="margin-top:16px;">${rows}</div>
  `;
}

  const acc = S.stats.totalAttempts ? Math.round(S.stats.totalCorrect/S.stats.totalAttempts*100) : 0;
  const byLevel = [1,2,3].map(l => ({ l, total: VOCAB.filter(w=>w.level===l).length }));

  return `
  <div class="eyebrow">Thống kê</div>
  <div class="section-title">Hành trình học của bạn</div>

  <div class="grid grid-2" style="margin-top:18px;">
    <div class="stat-chip"><div class="stat-chip__value text-orange">${currentStreak()}🔥</div><div class="stat-chip__label">Ngày liên tiếp</div></div>
    <div class="stat-chip"><div class="stat-chip__value">Lv.${lvl.level}</div><div class="stat-chip__label">${S.stats.xp} XP tổng</div></div>
    <div class="stat-chip"><div class="stat-chip__value text-cyan">${S.stats.totalSessions}</div><div class="stat-chip__label">Buổi luyện tập</div></div>
    <div class="stat-chip"><div class="stat-chip__value text-green">${acc}%</div><div class="stat-chip__label">Đúng ${S.stats.totalCorrect}/${S.stats.totalAttempts} câu</div></div>
  </div>

  <div class="field" style="margin-top:22px;">
    <label>Cấp độ ${lvl.level} · còn ${lvl.need-lvl.into} XP để lên cấp</label>
    <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${lvl.pct}%; background:var(--cyan);"></div></div>
  </div>

  <div class="section-head"><div><div class="eyebrow">Kho từ vựng</div><div class="section-title">Thư viện theo cấp độ</div></div></div>
  <div class="stack">
    ${byLevel.map(x => `<div class="word-row" style="align-items:center;">
        <div class="word-row__main"><div class="row-between"><span class="badge badge-lvl${x.l}">${levelName(x.l)}</span><span class="muted" style="font-size:12.5px;">${x.total} từ</span></div></div>
      </div>`).join('')}
  </div>

  <div class="section-head"><div><div class="eyebrow">Tình trạng hiện tại</div><div class="section-title">Từ cần chú ý</div></div></div>
  <div class="grid grid-2">
    <div class="stat-chip"><div class="stat-chip__value text-pink">${mistakeList().length}</div><div class="stat-chip__label">Từ hay sai</div></div>
    <div class="stat-chip"><div class="stat-chip__value text-yellow">${S.favorites.size}</div><div class="stat-chip__label">Từ yêu thích</div></div>
  </div>

  <div class="section-head"><div><div class="eyebrow">Dữ liệu</div><div class="section-title">Sao lưu &amp; khôi phục</div></div></div>
  <p class="muted" style="font-size:13.5px; line-height:1.55; margin-bottom:12px;">
    Tiến độ được lưu tự động trong trình duyệt này. Nếu bạn xóa dữ liệu duyệt web, đổi trình duyệt hoặc đổi thiết bị, hãy dùng file sao lưu.
    ${S.stats.lastBackup ? 'Sao lưu gần nhất: ' + escapeHtml(new Date(S.stats.lastBackup).toLocaleString('vi-VN')) + '.' : 'Bạn chưa sao lưu lần nào.'}
    ${HAS_LS ? '' : '<br><b>⚠️ Trình duyệt đang chặn lưu dữ liệu, dữ liệu sẽ mất khi đóng trang.</b>'}
  </p>
  <div class="grid grid-2">
    <button class="btn btn-primary btn-block" data-action="export-data">⬇️ Xuất sao lưu</button>
    <button class="btn btn-secondary btn-block" data-action="import-click">⬆️ Khôi phục</button>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <button class="btn btn-ghost btn-block" style="margin-top:12px;" data-action="reset-data">Xóa toàn bộ dữ liệu</button>
  `;
}
// ============================================================
// APP.JS — Part 6: action dispatcher, keyboard shortcuts, boot
// ============================================================

function afterRender(view){
  if (view === 'quiz' && S.session){
    if (S.session.mode === 'free'){
      const fi = document.getElementById('freeInput');
      if (fi) fi.focus();
      return;
    }
    wireQuizQuestion();
  }
}

// ---------- confirm modal (avoids native confirm()/alert() inside sandboxed iframes) ----------
function showConfirm(message, onConfirm, okLabel){
  S.confirmModal = { message, action: onConfirm, okLabel: okLabel || 'Xóa' };
  renderModal();
}
function renderModal(){
  let scrim = document.getElementById('modalScrim');
  if (!S.confirmModal){ if (scrim) scrim.remove(); return; }
  if (!scrim){
    scrim = document.createElement('div');
    scrim.id = 'modalScrim';
    scrim.className = 'modal-scrim';
    document.body.appendChild(scrim);
  }
  scrim.innerHTML = `<div class="modal-sheet">
    <p style="font-size:15px; margin-bottom:20px; line-height:1.5;">${escapeHtml(S.confirmModal.message)}</p>
    <div class="grid grid-2">
      <button class="btn btn-secondary" data-action="modal-cancel">Hủy</button>
      <button class="btn btn-danger" data-action="modal-confirm">${escapeHtml(S.confirmModal.okLabel || 'Xóa')}</button>
    </div>
  </div>`;
}

let searchDebounce = null;
function onLibrarySearchInput(value){
  S.library.search = value;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { S.library.limit = 60; refreshLibraryResults(); }, 150);
}
function onTimeSliderInput(value){
  S.setupTime = Number(value);
  const strongEl = document.querySelector('#timeField label strong');
  if (strongEl) strongEl.textContent = S.setupTime + 's';
}

function handleAction(action, dataset, node){
  switch(action){
    // ---- global nav ----
    case 'nav': navigate(dataset.view); break;
    case 'toggle-theme': {
      S.theme = S.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', S.theme);
      persistTheme();
      render();
      break;
    }
    case 'speak': speak(dataset.text); break;
    case 'toggle-fav': toggleFavorite(dataset.en); render(); break;

    // ---- home ----
    case 'start-flashcards-quick': {
      const words = quickFlashcardWords();
      S.flashSession = { words: shuffleArray(words), index:0, flipped:false, knowCount:0, total: words.length, sourceLabel: 'Gợi ý nhanh cho bạn' };
      navigate('flashcards');
      break;
    }

    // ---- library ----
    case 'lib-set-level': S.library.level = dataset.level; S.library.cat = 'all'; S.library.limit = 60; render(); break;
    case 'lib-set-cat': S.library.cat = dataset.cat; S.library.limit = 60; render(); break;
    case 'lib-reset': S.library = { level:'all', cat:'all', search:'', limit:60 }; render(); break;
    case 'lib-load-more': S.library.limit += 60; refreshLibraryResults(); break;
    case 'lib-start': {
      const words = filteredLibraryWords();
      if (!words.length) break;
      const levelLabel = S.library.level==='all' ? 'Mọi cấp độ' : levelName(S.library.level);
      const catLabel = S.library.cat==='all' ? 'mọi chủ đề' : catName(S.library.cat);
      setPendingSource(words, `${levelLabel} · ${catLabel}`);
      navigate('setup');
      break;
    }

    // ---- setup ----
    case 'setup-set-count': S.setupCount = Number(dataset.count); render(); break;
    case 'setup-set-mode': S.setupMode = dataset.mode; render(); break;
    case 'start-session': {
      const src = S.pendingSource;
      if (!src) break;
      const words = sampleArray(src.words, S.setupCount || src.words.length);
      startSession(words, S.setupMode, S.setupTime || 8, src.label);
      break;
    }

    // ---- custom lists ----
    case 'custom-new': S.editingListName = ''; render(); break;
    case 'custom-edit': S.editingListName = dataset.name; render(); break;
    case 'custom-cancel-edit': S.editingListName = null; render(); break;
    case 'custom-practice': {
      const words = S.customLists[dataset.name];
      if (!words) break;
      setPendingSource(words.map(w => ({...w, level:0, cat:'custom'})), dataset.name);
      navigate('setup');
      break;
    }
    case 'custom-delete': {
      showConfirm(`Xóa bộ từ "${dataset.name}"? Không thể hoàn tác.`, () => {
        delete S.customLists[dataset.name];
        persistCustomLists();
        render();
      });
      break;
    }
    case 'custom-save': {
      const nameInput = document.getElementById('customName');
      const textInput = document.getElementById('customText');
      const name = (nameInput?.value || '').trim();
      const text = textInput?.value || '';
      const errorSlot = document.getElementById('customError');
      if (!name){ if (errorSlot) errorSlot.innerHTML = '<p class="error-text">Vui lòng đặt tên cho bộ từ.</p>'; break; }
      const { dict, badCount } = parseCustomInput(text);
      if (dict.length < 4){
        if (errorSlot) errorSlot.innerHTML = `<p class="error-text">Cần tối thiểu 4 cặp từ hợp lệ (hiện có ${dict.length} hợp lệ). Định dạng mỗi dòng: "tiếng anh - tiếng việt".</p>`;
        break;
      }
      if (S.editingListName && S.editingListName !== '' && S.editingListName !== name) delete S.customLists[S.editingListName];
      S.customLists[name] = dict;
      persistCustomLists();
      S.editingListName = null;
      toast(badCount ? `Đã lưu ${dict.length} từ (bỏ qua ${badCount} dòng không hợp lệ).` : `Đã lưu ${dict.length} từ.`);
      render();
      break;
    }

    // ---- quiz ----
    case 'submit-mc': submitMC(Number(dataset.idx)); break;
    case 'submit-tf': submitTF(dataset.val === '1'); break;
    case 'submit-typed': submitTyped(); break;
    case 'submit-free': submitFree(); break;
    case 'quiz-replay-audio': { const q = S.session?.questions[S.session.index]; if (q) speak(cleanEn(q.word.en)); break; }
    case 'cancel-quiz': cancelSession(); break;

    // ---- results ----
    case 'result-retry': {
      const r = S.lastResult;
      if (r) startSession(r.words, r.mode, r.timeLimit, r.sourceLabel);
      break;
    }
    case 'result-change-setup': {
      const r = S.lastResult;
      if (r){ setPendingSource(r.words, r.sourceLabel); S.setupMode = r.mode; S.setupTime = r.timeLimit; navigate('setup'); }
      break;
    }

    // ---- flashcards ----
    case 'flip-card': flipCard(); break;
    case 'card-know': cardKnow(); break;
    case 'card-dontknow': cardDontKnow(); break;
    case 'flash-restart-missed': restartMissedFlashcards(); break;
    case 'exit-flashcards': exitFlashcards(); break;

    // ---- mistakes / favorites ----
    case 'mistakes-practice': {
      const list = mistakeList().map(m => VOCAB_BY_EN.get(m.en.toLowerCase()) || m);
      setPendingSource(list, 'Từ hay sai');
      navigate('setup');
      break;
    }
    case 'favorites-practice': {
      setPendingSource(favoriteWords(), 'Từ yêu thích');
      navigate('setup');
      break;
    }

    // ---- backup ----
    case 'export-data': exportData(); break;
    case 'import-click': { const f = document.getElementById('importFile'); if (f) f.click(); break; }
    case 'reset-data':
      showConfirm('Xóa toàn bộ XP, streak, từ hay sai, yêu thích và danh sách riêng? Không thể hoàn tác.', resetAllData, 'Xóa hết');
      break;

    // ---- modal ----
    case 'modal-cancel': S.confirmModal = null; renderModal(); break;
    case 'modal-confirm': {
      const act = S.confirmModal?.action;
      S.confirmModal = null; renderModal();
      if (act) act();
      break;
    }
  }
}

// ---------- global delegated listeners (registered once; survive re-renders) ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  e.preventDefault();
  handleAction(t.dataset.action, t.dataset, t);
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'importFile'){ importData(e.target.files[0]); e.target.value = ''; }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'librarySearch') onLibrarySearchInput(e.target.value);
  if (e.target.id === 'timeSlider') onTimeSliderInput(e.target.value);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter'){
    const id = document.activeElement?.id;
    if (id === 'freeInput'){ e.preventDefault(); submitFree(); return; }
    if (id === 'answerInput'){ e.preventDefault(); submitTyped(); return; }
    if (id === 'customName'){ e.preventDefault(); return; }
  }
  if (S.view === 'quiz' && S.session && S.session.mode !== 'free' && !S.session.answered){
    const tag = document.activeElement?.tagName;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA'){
      const q = S.session.questions[S.session.index];
      if (q && (q.type==='mc' || q.type==='listen') && ['1','2','3','4'].includes(e.key)){
        const idx = Number(e.key) - 1;
        if (idx < q.options.length) submitMC(idx);
      } else if (q && q.type==='tf'){
        if (e.key === '1') submitTF(true);
        if (e.key === '2') submitTF(false);
      }
    }
  }
  if (e.key === 'Escape'){
    if (S.confirmModal){ S.confirmModal = null; renderModal(); return; }
    if (S.session){
      if (S.session.mode === 'free') cancelSession();
      else showConfirm('Hủy bài đang làm? Kết quả bài này sẽ không được tính.', cancelSession, 'Hủy bài');
    }
    else if (S.flashSession){ exitFlashcards(); }
  }
});

// ---------- boot ----------
async function boot(){
  const defaults = STATS_DEFAULTS;
  try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const [stats, favorites, mistakes, customLists, theme] = await Promise.all([
    loadKey('stats', defaults),
    loadKey('favorites', []),
    loadKey('mistakes', {}),
    loadKey('customLists', {}),
    loadKey('theme', 'dark'),
  ]);
  S.stats = Object.assign({}, defaults, stats);
  S.favorites = new Set(favorites);
  S.mistakes = mistakes || {};
  S.customLists = customLists || {};
  S.theme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', S.theme);
  booted = true;
  if (!HAS_LS) warnStorage();
  navigate('home');
}

boot();

// ---------- PWA: đăng ký service worker (chỉ chạy khi mở qua http/https) ----------
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) toast('🔄 Đã có bản mới, tải lại trang để cập nhật.');
  });
}
