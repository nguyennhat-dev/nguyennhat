<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Nguyennhatt">
<meta name="theme-color" content="#0d0e12">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>Nguyennhatt</title>
<style>
:root{--bg:#0d0e12;--panel:#15171d;--raise:#1e2129;--line:#272b35;--text:#e9e7e2;--dim:#8d92a0;--acc:#79c0ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:none;border:0;border-radius:10px;cursor:pointer;min-width:44px;min-height:44px;padding:0 12px}
:focus-visible{outline:2px solid var(--acc)}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
header h1{font-size:20px;flex:1}header span{color:var(--dim)}
.pri{background:var(--acc);color:#0d0e12;font-weight:600}
#q{margin:6px 16px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:44px;font-size:16px}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 8px}
.row{display:block;width:100%;text-align:left;min-height:48px;padding:10px 12px;border-bottom:1px solid #1b1e26;border-radius:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur{color:var(--acc);font-weight:600}
.empty{color:var(--dim);text-align:center;padding:60px 24px;line-height:1.7}
footer{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#nt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;gap:8px;align-items:center;color:var(--dim);font-variant-numeric:tabular-nums}
.prog input{flex:1;height:32px}
input[type=range]{accent-color:var(--acc)}
.btns{display:flex;justify-content:space-between;align-items:center}
.btns .big{background:var(--text);color:#0d0e12;border-radius:50%;width:52px;height:52px;padding:0;font-size:20px}
.on{color:var(--acc)}
.menu{position:fixed;z-index:9;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:4px;display:flex;flex-direction:column;min-width:190px;box-shadow:0 10px 30px #000a}
.menu button{text-align:left}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
 <header><h1>Nguyennhatt</h1><span id="cnt"></span><button class="pri" id="add">＋ Thêm nhạc</button></header>
 <input type="search" id="q" placeholder="Tìm bài hát…" aria-label="Tìm bài hát">
 <div id="list"></div>
 <footer>
  <div id="nt">Chưa phát</div>
  <div class="prog"><span id="tc">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Tiến trình"><span id="td">0:00</span></div>
  <div class="btns">
   <button id="shuf" title="Ngẫu nhiên">⇄</button><button id="prev" title="Bài trước">⏮</button>
   <button class="big" id="pp" title="Phát / Dừng">▶</button>
   <button id="next" title="Bài sau">⏭</button><button id="rep" title="Lặp lại">↻</button><button id="sl" title="Hẹn giờ tắt">☾</button>
  </div>
 </footer>
</div>
<input type="file" id="fi" accept="audio/*,.mp3,.m4a,.wav,.flac" multiple hidden>
<div id="toast"></div>
<script>
'use strict';
/* Nguyennhatt – trình phát nhạc gọn nhẹ, chạy hoàn toàn offline.
   Không lưu gì giữa các lần mở: mỗi lần dùng, bạn chọn lại tệp nhạc từ ứng dụng Tệp.
   Dùng MỘT thẻ <audio> duy nhất và không qua Web Audio → ổn định nhất khi khóa màn hình trên iOS. */
const $=s=>document.querySelector(s);
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const au=new Audio();au.preload='auto';
let tracks=[],Q=[],cur=null,url=null,shuffle=false,repeat=0,bag=[],hist=[],sleepT=0,sleepEnd=false,q='',uid=0,seeking=false,lastPos=0;
const byId=id=>tracks.find(t=>t.id===id);
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)}
function menu(x,y,items){document.querySelectorAll('.menu').forEach(m=>m.remove());const m=document.createElement('div');m.className='menu';
  m.innerHTML=items.map((it,i)=>`<button data-i="${i}">${it[0]}</button>`).join('');document.body.appendChild(m);
  m.style.left=Math.max(8,Math.min(x,innerWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-m.offsetHeight-8))+'px';
  m.onclick=e=>{const b=e.target.closest('button');if(b){m.remove();items[b.dataset.i][1]()}};
  setTimeout(()=>addEventListener('click',()=>m.remove(),{once:true}))}

/* ---------- Thêm nhạc ---------- */
function addFiles(files){
  let n=0,dup=0;
  for(const f of files){
    if(!/\.(mp3|wav|m4a|flac|aac|ogg)$/i.test(f.name)&&!(f.type||'').startsWith('audio/'))continue;
    if(tracks.some(t=>t.file.name===f.name&&t.file.size===f.size)){dup++;continue}
    tracks.push({id:++uid,title:f.name.replace(/\.[^.]+$/,'').replace(/_/g,' '),file:f});n++;
  }
  tracks.sort((a,b)=>a.title.localeCompare(b.title,'vi',{numeric:true,sensitivity:'base'}));
  toast(n?`Đã thêm ${n} bài`+(dup?` · bỏ qua ${dup} bài trùng`:''):(dup?'Các bài này đã có':'Không có tệp nhạc hợp lệ'));
  render();
}
function shown(){const k=norm(q);return k?tracks.filter(t=>norm(t.title).includes(k)):tracks}
function render(){
  const l=shown();$('#cnt').textContent=tracks.length?tracks.length+' bài':'';
  $('#list').innerHTML=l.length?l.map(t=>`<button class="row ${t.id===cur?'cur':''}" data-id="${t.id}">${t.title.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</button>`).join('')
   :`<div class="empty">${tracks.length?'Không tìm thấy bài nào.':'Bấm “＋ Thêm nhạc”, chọn <b>Duyệt</b> rồi chọn các bài trong ứng dụng Tệp (bấm Chọn → Chọn tất cả).<br><br>Danh sách không được lưu: mỗi lần mở lại app bạn chọn nhạc lại.'}</div>`;
}

/* ---------- Phát nhạc ---------- */
function play(id,noHist){
  const t=byId(id);if(!t)return;
  if(!noHist&&cur!=null&&cur!==id){hist.push(cur);if(hist.length>200)hist.shift()}
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(t.file);au.src=url;cur=id;lastPos=0;
  au.play().catch(()=>toast('Không phát được tệp này'));
  $('#nt').textContent=t.title;document.title=t.title;
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('cur',+r.dataset.id===id));
  setMedia(t);
}
function toggle(){
  if(!au.src){const l=shown();if(l.length){Q=l.map(t=>t.id);play(Q[0])}return}
  au.paused?au.play():au.pause();
}
function nextShuffle(){ // Túi xáo trộn Fisher-Yates: hết một vòng mới lặp lại bài
  bag=bag.filter(x=>Q.includes(x)&&x!==cur);
  if(!bag.length){bag=Q.filter(x=>x!==cur);for(let i=bag.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[bag[i],bag[j]]=[bag[j],bag[i]]}}
  return bag.pop()}
function next(auto){
  if(auto&&sleepEnd){sleepEnd=false;upd();au.pause();toast('Đã dừng theo hẹn giờ');return}
  if(auto&&repeat===2){au.currentTime=0;au.play();return}
  if(!Q.length)return;let n;
  if(shuffle&&Q.length>1)n=nextShuffle();
  else{let j=Q.indexOf(cur)+1;if(j>=Q.length){if(auto&&repeat===0)return;j=0}n=Q[j]}
  play(n);
}
function prev(){
  if(au.currentTime>3)au.currentTime=0;
  else if(hist.length)play(hist.pop(),true);
  else if(Q.length){const j=Q.indexOf(cur)-1;play(Q[j<0?Q.length-1:j],true)}
}
au.onended=()=>next(true);
au.onplay=au.onpause=()=>{$('#pp').textContent=au.paused?'▶':'⏸';if('mediaSession'in navigator)navigator.mediaSession.playbackState=au.paused?'paused':'playing'};
au.onerror=()=>{if(au.src)toast('Không đọc được tệp này (định dạng không hỗ trợ?)')};
au.ontimeupdate=()=>{
  const d=au.duration;$('#tc').textContent=fmt(au.currentTime);$('#td').textContent=isFinite(d)?fmt(d):'0:00';
  if(!seeking&&d)$('#seek').value=au.currentTime/d*1000;
  if('mediaSession'in navigator&&d>1&&isFinite(d)&&Math.abs(au.currentTime-lastPos)>=1){lastPos=au.currentTime;
    try{navigator.mediaSession.setPositionState({duration:d,playbackRate:1,position:Math.min(au.currentTime,d)})}catch(e){}}
};

/* ---------- Media Session: điều khiển trên màn hình khóa / trung tâm điều khiển ---------- */
let artUrl='';
function art(){if(artUrl)return artUrl;const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,'#3b6fb6');g.addColorStop(1,'#10131a');x.fillStyle=g;x.fillRect(0,0,512,512);
  x.fillStyle='#ffffffcc';x.font='bold 280px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('♪',256,280);return artUrl=c.toDataURL('image/png')}
function setMedia(t){
  if(!('mediaSession'in navigator))return;const m=navigator.mediaSession;
  m.metadata=new MediaMetadata({title:t.title,artist:'Nguyennhatt',artwork:[{src:art(),sizes:'512x512',type:'image/png'}]});
  const h=(a,f)=>{try{m.setActionHandler(a,f)}catch(e){}};
  h('play',()=>au.play());h('pause',()=>au.pause());h('nexttrack',()=>next(false));h('previoustrack',prev);
  h('seekto',e=>{au.currentTime=e.seekTime});
  h('seekbackward',e=>{au.currentTime=Math.max(0,au.currentTime-(e.seekOffset||10))});
  h('seekforward',e=>{au.currentTime=Math.min(au.duration||0,au.currentTime+(e.seekOffset||10))});
}

/* ---------- Hẹn giờ tắt ---------- */
function setSleep(m){
  clearTimeout(sleepT);sleepT=0;sleepEnd=false;
  if(m==='end'){sleepEnd=true;toast('Sẽ dừng sau khi hết bài này')}
  else if(m){sleepT=setTimeout(()=>{au.pause();sleepT=0;upd();toast('Đã dừng theo hẹn giờ')},m*60000);toast(`Tắt nhạc sau ${m} phút`)}
  else toast('Đã hủy hẹn giờ');upd();
}
function upd(){$('#sl').classList.toggle('on',!!(sleepT||sleepEnd));$('#shuf').classList.toggle('on',shuffle);$('#rep').classList.toggle('on',repeat>0);$('#rep').textContent=repeat===2?'↻¹':'↻'}

/* ---------- Sự kiện ---------- */
$('#add').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#q').oninput=e=>{q=e.target.value;render()};
$('#list').onclick=e=>{const r=e.target.closest('.row');if(!r)return;Q=shown().map(t=>t.id);bag=[];play(+r.dataset.id)};
$('#pp').onclick=toggle;$('#next').onclick=()=>next(false);$('#prev').onclick=prev;
$('#shuf').onclick=()=>{shuffle=!shuffle;bag=[];upd();toast(shuffle?'Ngẫu nhiên: bật':'Ngẫu nhiên: tắt')};
$('#rep').onclick=()=>{repeat=(repeat+1)%3;upd();toast(['Không lặp','Lặp cả danh sách','Lặp một bài'][repeat])};
$('#sl').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();
  menu(r.left-120,r.top-260,[...[15,30,45,60].map(m=>[m+' phút',()=>setSleep(m)]),['Sau khi hết bài hiện tại',()=>setSleep('end')],['Hủy hẹn giờ',()=>setSleep(0)]])};
$('#seek').oninput=e=>{seeking=true;if(au.duration)au.currentTime=e.target.value/1000*au.duration};
$('#seek').onchange=()=>{seeking=false};
addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();toggle()}});
upd();render();

/* ---------- Offline: Service Worker lưu sẵn app vào bộ nhớ máy ---------- */
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
